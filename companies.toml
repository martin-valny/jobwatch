# jobwatch config. Title patterns are Python regexes, matched case-insensitively.

[filters]
include_titles = [
  "computational biolog",
  "bioinformatic",
  "single[- ]cell",
  "systems biolog",
  "computational (scientist|biologist)",
  "biostatistic",
  "(genomic|genetic).*(scientist|analyst|engineer)",
  "(\\bml|machine learning|\\bai\\b|data|computational|deep learning).*\\b(scientist|engineer|researcher|analyst)\\b.*(bio(?!metric)|drug|protein|genom|genetic|molecul|omics|\\bcell|pharma|therapeut|neuro|immun|oncolog)",
  "(bio(?!metric)|drug|protein|genom|genetic|molecul|omics|\\bcell|pharma|therapeut|neuro|immun|oncolog).*(ml|machine learning|\\bai\\b|data|computational|deep learning).*\\b(scientist|engineer|researcher|analyst)\\b",
  "\\b(ai|ml|machine learning|computational) (bio|neuro)\\w*",
  "research scientist.*(bio(?!metric)|drug|protein|genom|genetic|molecul|omics|\\bcell|pharma|therapeut|neuro|immun|oncolog)",
  "proteomic|transcriptomic|multi-?omic|\\bomics\\b",
]
exclude_titles = ["\\bintern\\b", "internship", "co-?op\\b", "postdoc", "student", "ai trainer", "freelance"]

# Looser patterns: a title that matches one of these but not include_titles is reported in a separate
# "Broader matches" section (same verdicts and exclude_titles; these never add companies to the learned
# list). At most broad_max new ones are shown per run, newest first; the rest wait for later runs.
# Leave broad_titles empty to turn the section off.
broad_titles = [
  "data scientist",
  "(ml|machine learning|ai).*(scientist|biolog)",
  "scientist.*(computational|data|machine learning|\\bml\\b|\\bai\\b)",
  "research scientist",
]
broad_max = 100
# Only English, Spanish or Czech postings in the main and broader sections: roles written in another language,
# or requiring one ("fluent German required"), are dropped; "German is a plus" is fine. A keyword check, so it
# can misjudge a few postings. Remove the line to turn the check off. ([students] has its own, stricter
# setting: English and Spanish only.)
languages = ["en", "es", "cs"]
# Broader matches with a soft tie to biology are listed first, in their own sub-section, with the matching
# terms. A hit in the title or company name counts; in the description it takes two different terms.
bio_hints = [
  "\\bbio\\b", "biolog", "bioinformat", "biotech", "biomed", "biosignal", "biostat",
  "genom", "genetic", "proteom", "protein", "single[- ]cell", "molecul",
  "drug discovery", "pharma", "therapeutic", "clinical (trial|data|research)", "life scienc",
  "healthcare", "patient", "medic(al|ine)", "neuroscien",
]

# Which verdicts to report:
#   europe-remote   remote + a Europe signal in location or description
#   remote-unclear  remote, no region stated (ask the recruiter)
#   europe-onsite   European office, not flagged remote
#   flag-only       only Ashby's isRemote flag says remote, and the location is an office (hidden by default:
#                   that flag also comes with hybrid and office roles)
#   us-remote       remote but US-only wording
verdicts = ["europe-remote", "remote-unclear"]

# Student, internship and junior roles that fit a profile (biology BSc, bench-science experience, now an MSc
# in economic data analysis), reported in their own section. Regexes are case-insensitive. A role needs a
# student- or junior-type title (and none of `exclude`), a profile topic in the title or description, or a bio connection
# (see bio_hints above), remote work that is open across Europe (see region_ok), and a posting in an accepted
# language. On-site roles count only when the location matches `local`. These roles are left out of the other
# sections. At most `max` new ones per run.
[students]
enabled = true
titles = [
  "\\bintern(ship)?s?\\b", "working student", "werkstudent", "\\bstudent\\b", "\\btrainee\\b",
  "\\bthesis\\b", "co-?op\\b", "praktik", "stagiaire", "apprentice",
  "\\bjunior\\b", "\\bjr\\b", "entry[- ]level", "\\bgraduate\\b", "early[- ]career", "\\bassociate (data|analyst|scientist)",
]
exclude = ["postdoc", "\\bphd\\b", "ph\\.d", "senior", "\\blead\\b", "principal", "director", "head of"]
topics = [
  "data", "analy", "statistic", "bioinformat", "biolog", "genom", "laborator", "\\blab\\b", "research",
  "scien", "econom", "quantitative", "machine learning", "\\bml\\b", "\\bai\\b", "biotech", "pharma",
  "clinical", "health", "epidemiolog", "heor", "market access", "r&d", "modell?ing", "python", "\\bsql\\b",
]
verdicts = ["europe-remote", "remote-unclear"]
# Remote roles must name one of these (in the location or the description's remote wording); a role limited
# to "Remote, Germany" or a list of other countries is dropped.
region_ok = "europe|european|\\beu\\b|emea|\\bcet\\b|\\bcest\\b|czech|prague|praha|worldwide|anywhere|global"
# Postings that tie the job to Germany whatever the location says.
exclude_text = ["germany[- ]based", "based in germany", "located in germany", "resident (in|of) germany"]
local = "prague|praha"
# Only English or Spanish postings: roles written in another language, or asking for one ("fluent German
# required", "French required"), are dropped; "German is a plus" is fine. A keyword check, so it can misjudge
# a few postings. Remove the line to turn the check off.
languages = ["en", "es"]
max = 50

[settings]
max_workers = 16   # parallel requests when checking boards

# Boards found by `python jobwatch.py discover` (Common Crawl). Thousands of
# companies, mostly general tech; the title filter keeps only relevant roles.
[discovery]
enabled = true
file = ".jobwatch/discovered.json"


# Extra company lists, loaded alongside the companies below (entries here win on
# duplicates). companies_yc.toml is regenerated monthly by `import-yc`.
[sources]
company_files = ["companies_yc.toml"]

# Investor portfolio job boards (Getro). Each is searched with these keywords
# every run; matching roles are reported, and their companies are learned and
# checked directly from then on. To add a board: open the investor's jobs page;
# if the footer says "Powered by Getro", add its address below. Consider-powered
# boards (a16z, Sequoia, Greylock, ...) currently reject automated requests.
[vc_boards]
enabled = true
keywords = ["computational biology", "bioinformatics", "single cell", "machine learning biology"]

